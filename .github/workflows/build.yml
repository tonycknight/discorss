name: Build & Release


on:
  push:
  workflow_dispatch:

env:
  build-version-number: 0.1.${{ github.run_number }}  
  docker-image-feedservice-name: ghcr.io/tonycknight/discorss.feed.service
  docker-image-messagehubservice-name: ghcr.io/tonycknight/discorss.messagehub.service
  docker-image-ingestionservice-name: ghcr.io/tonycknight/discorss.ingestion.service
   
jobs:
  sca:
    uses: ./.github/workflows/sca.yml
    
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
                
      - name: dotnet tool restore
        run: dotnet tool restore
              
      - name: Run build
        run: dotnet run --project ./build/build.fsproj -t "Build"

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
                
      - name: Package restore
        run: |
          dotnet tool restore
          dotnet restore
              
      - name: Run Tests
        run: dotnet test -c Debug --filter FullyQualifiedName!~integration /p:CollectCoverage=true /p:CoverletOutput=./TestResults/coverage.info /p:CoverletOutputFormat=cobertura --logger "trx;LogFileName=test_results.trx" 

      - name: Consolidate code coverage
        if: always()
        run: dotnet reportgenerator -reports:"./test/**/coverage.info" -targetdir:"./publish/codecoveragedata" -reporttypes:"Cobertura"
      
      - name: Archive Test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests.results
          path: |
            ./test/**/TestResults/*
            
      - name: Archive Code coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codecoverage
          path: ./publish/codecoverage/*.*
          
      - name: Unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: unit test results
          path: ${{ github.workspace }}/test/**/TestResults/test_results.trx
          reporter: dotnet-trx
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Code coverage results
        uses: 5monkeys/cobertura-action@master
        if: always()
        with:
          path: ${{ github.workspace }}/publish/codecoveragedata/Cobertura.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 10
          fail_below_threshold: true
          show_line: true
          show_branch: true
          show_missing: true
          show_class_names: true
          link_missing_lines: true
          report_name: code coverage results
  
  benchmarks:    
    # using Windows, as running ubuntu clears DLLs mid-way, causing aborts
    runs-on: windows-latest
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
                
      - name: dotnet tool restore
        run: dotnet tool restore
              
      - name: Run benchmarks
        run: dotnet run --project ./build/build.fsproj -t "Benchmarks"

      - name: Archive Benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks.results
          path: |
            ./BenchmarkDotNet.Artifacts/**/results/*.html
    
  build-docker-feedservice-image:
    runs-on: ubuntu-latest
    needs:   [ build, tests, sca ]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set Docker image name
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "docker-image-feedservice-name=${{ env.docker-image-feedservice-name }}:v${{ env.build-version-number }}" >> $GITHUB_ENV

      - name: Set Preview Docker image name
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "docker-image-feedservice-name=${{ env.docker-image-feedservice-name }}:dev" >> $GITHUB_ENV
        
      - name: Build docker image
        run: docker build -f Dockerfile-FeedService -t ${{ env.docker-image-feedservice-name }} --build-arg BuildVersion=${{ env.build-version-number }} .

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR }}

      - name: Push docker image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push ${{ env.docker-image-feedservice-name }}

  build-docker-ingestionservice-image:
    runs-on: ubuntu-latest
    needs:   [ build, tests, sca ]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set Docker image name
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "docker-image-ingestionservice-name=${{ env.docker-image-ingestionservice-name }}:v${{ env.build-version-number }}" >> $GITHUB_ENV

      - name: Set Preview Docker image name
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "docker-image-ingestionservice-name=${{ env.docker-image-ingestionservice-name }}:dev" >> $GITHUB_ENV
        
      - name: Build docker image
        run: docker build -f Dockerfile-IngestionService -t ${{ env.docker-image-ingestionservice-name}} --build-arg BuildVersion=${{ env.build-version-number }} .

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR }}

      - name: Push docker image
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push ${{ env.docker-image-ingestionservice-name }}
