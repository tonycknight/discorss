name: SCA

permissions:
  actions: read
  pull-requests: write
  security-events: write
  contents: write
  checks: write


on:
  workflow_call:
    inputs:
      username:
        required: false
        type: string
    secrets:
      token:
        required: false

jobs:
  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
                
      - name: Package checks
        uses: tonycknight/pkgchk-action@v1
        with:
          scan-issues: true
          scan-upgrades: true
          config: pkgchk.config.yml
  