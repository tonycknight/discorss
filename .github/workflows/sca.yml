name: SCA

permissions:
  actions: read
  pull-requests: write
  security-events: write
  contents: write
  checks: write


on:
  workflow_call:
    inputs:
      username:
        required: false
        type: string
    secrets:
      token:
        required: false

jobs:
  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
                
      - name: Vulnerable package checks
        uses: tonycknight/pkgchk-action@v1
      
  