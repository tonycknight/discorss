name: SCA

on:
  workflow_call:
    inputs:
      username:
        required: false
        type: string
    secrets:
      token:
        required: false
  schedule:
    - cron: '16 2 * * 4'

jobs:
  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        
      - name: Restore tools
        run: |
          dotnet tool restore
          
      - name: Vulnerable package checks
        uses: tonycknight/pkgchk-action@v1.0.15
        with:
          trace: true
      
  